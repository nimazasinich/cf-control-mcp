name: Temporary apply Wandbox migration

on:
  push:
    branches: [feat/wandbox-code-runner]
    paths:
      - '.github/workflows/_apply-wandbox-migration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wandbox-code-runner
          fetch-depth: 0

      - name: Wire Wandbox backend and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/index.ts')
          s = p.read_text()
          import_anchor = 'import { internetTools } from "./internet/tools";\n'
          import_line = 'import { wandboxExecute, wandboxRuntimes } from "./code-execution/wandbox";\n'
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('index import anchor not found')
              s = s.replace(import_anchor, import_anchor + import_line, 1)

          s = s.replace('// Sandbox code execution (Piston, emkc.org) — free, no API key required.', '// Sandbox code execution (Wandbox) — public API, no API key required.')
          s = s.replace('(Piston or GitHub) can hold a Worker request open indefinitely', '(Wandbox or GitHub) can hold a Worker request open indefinitely')

          pattern = re.compile(r'const PISTON_TIMEOUT_MS = 25_000;\nconst GITHUB_TIMEOUT_MS = 20_000;\n\n/\*\* Executes a snippet via the public Piston API.*?async function pistonRuntimes\(\): Promise<any> \{.*?\n\}\n', re.S)
          s, removed = pattern.subn('const GITHUB_TIMEOUT_MS = 20_000;\n', s, count=1)
          if removed != 1 and ('pistonExecute(' in s or 'pistonRuntimes(' in s):
              raise SystemExit(f'expected one Piston helper block, removed={removed}')

          old_desc = '''\t\tdescription:\n\t\t\t"Execute a short code snippet for free in an ephemeral public sandbox (Piston, emkc.org) and return " +\n\t\t\t"stdout, stderr, and exit code. Supports common languages (python, javascript/node, typescript, bash, " +\n\t\t\t"go, rust, java, c, cpp, etc — call list_code_runtimes for the exact catalog). No account or credentials " +\n\t\t\t"involved, no persistent state, and nothing here touches the Cloudflare/HF accounts. Not suitable for " +\n\t\t\t"secrets or private data: the sandbox is a shared free third-party service.",'''
          new_desc = '''\t\tdescription:\n\t\t\t"Execute a short code snippet in the public Wandbox sandbox and return stdout, stderr, and exit code. " +\n\t\t\t"Supports common languages (python, javascript/node, typescript, bash, go, rust, java, c, cpp, etc — " +\n\t\t\t"call list_code_runtimes for the live compiler catalog). No account or API key is required. The sandbox is " +\n\t\t\t"a shared third-party service with no SLA, so do not send secrets or private data.",'''
          if old_desc not in s:
              raise SystemExit('run_code description anchor not found')
          s = s.replace(old_desc, new_desc, 1)
          s = s.replace('language: { type: "string", description: "Piston language id, e.g. \'python\', \'javascript\', \'bash\', \'go\'" },', 'language: { type: "string", description: "Wandbox language alias or exact compiler name, e.g. \'python\', \'javascript\', \'bash\', \'go\'" },', 1)

          old_handler = '''\t\thandler: async (args) => {\n\t\t\tconst language = String(args.language ?? "").trim();\n\t\t\tconst code = String(args.code ?? "");\n\t\t\tif (!language) throw new Error("language is required");\n\t\t\tif (!code.trim()) throw new Error("code is empty");\n\t\t\tif (code.length > 200_000) throw new Error("code exceeds 200 KB sandbox limit");\n\t\t\tconst version = String(args.version ?? "*");\n\t\t\tconst stdin = String(args.stdin ?? "");\n\t\t\tconst cliArgs = Array.isArray(args.args) ? args.args.map((a) => String(a)).slice(0, 32) : [];\n\t\t\treturn await pistonExecute(language, version, code, stdin, cliArgs);\n\t\t},'''
          new_handler = '''\t\thandler: async (args) => {\n\t\t\tconst language = String(args.language ?? "").trim();\n\t\t\tconst code = String(args.code ?? "");\n\t\t\tif (!language) throw new Error("language is required");\n\t\t\tif (!code.trim()) throw new Error("code is empty");\n\t\t\tif (code.length > 200_000) throw new Error("code exceeds 200 KB sandbox limit");\n\t\t\tconst version = String(args.version ?? "*");\n\t\t\tconst stdin = String(args.stdin ?? "");\n\t\t\tconst cliArgs = Array.isArray(args.args) ? args.args.map((a) => String(a)).slice(0, 32) : [];\n\t\t\treturn await wandboxExecute(language, version, code, stdin, cliArgs);\n\t\t},'''
          if old_handler not in s:
              raise SystemExit('run_code handler anchor not found')
          s = s.replace(old_handler, new_handler, 1)

          old_runtime = '''\t\tdescription: "List the languages/versions currently available in the free Piston sandbox used by run_code.",\n\t\tinputSchema: { type: "object", properties: {} },\n\t\tannotations: { readOnlyHint: true, openWorldHint: true },\n\t\thandler: async () => await pistonRuntimes(),'''
          new_runtime = '''\t\tdescription: "List the live compiler/language catalog currently available from Wandbox for run_code.",\n\t\tinputSchema: { type: "object", properties: {} },\n\t\tannotations: { readOnlyHint: true, openWorldHint: true },\n\t\thandler: async () => await wandboxRuntimes(),'''
          if old_runtime not in s:
              raise SystemExit('list_code_runtimes anchor not found')
          s = s.replace(old_runtime, new_runtime, 1)
          s = s.replace('Unlike run_code (Piston), this can', 'Unlike run_code (Wandbox), this can', 1)
          p.write_text(s)

          p = Path('test/exec-tools.test.ts')
          s = p.read_text()
          start = s.index('// ---------------------------------------------------------------------------\n// run_code (Piston)')
          end = s.index('// ---------------------------------------------------------------------------\n// gh_run_code', start)
          replacement = r'''// ---------------------------------------------------------------------------
// run_code (Wandbox)
// ---------------------------------------------------------------------------

const pythonCompiler = {
  name: "python-head",
  language: "Python",
  version: "3.13.0",
  "display-name": "Python HEAD",
  "runtime-option-raw": true,
};

test("run_code: resolves a live Wandbox compiler and returns compatible run output", async () => {
  const calls: { url: string; init: RequestInit }[] = [];
  globalThis.fetch = (async (url: any, init: any = {}) => {
    calls.push({ url: String(url), init });
    if (String(url).endsWith("/list.json")) return jsonResponse([pythonCompiler]);
    return jsonResponse({ status: "0", program_output: "2\n", program_error: "", compiler_error: "" });
  }) as any;

  const tool = findTool("run_code");
  const result: any = await tool.handler({ language: "python", code: "print(1+1)" }, mockEnv());

  assert.equal(result.backend, "wandbox");
  assert.equal(result.run.stdout, "2\n");
  assert.equal(result.run.stderr, "");
  assert.equal(result.run.code, 0);
  assert.equal(result.compiler.name, "python-head");
  assert.equal(calls.length, 2);
  assert.match(calls[0].url, /wandbox\.org\/api\/list\.json$/);
  assert.match(calls[1].url, /wandbox\.org\/api\/compile\.json$/);
  const sentBody = JSON.parse(String(calls[1].init.body));
  assert.equal(sentBody.compiler, "python-head");
  assert.equal(sentBody.code, "print(1+1)");
  assert.equal(sentBody.save, false);
});

test("run_code: exact Wandbox compiler name bypasses alias resolution", async () => {
  let compileBody: any = null;
  globalThis.fetch = (async (url: any, init: any = {}) => {
    if (String(url).endsWith("/list.json")) return jsonResponse([pythonCompiler]);
    compileBody = JSON.parse(String(init.body));
    return jsonResponse({ status: 0, program_output: "ok\n" });
  }) as any;
  const tool = findTool("run_code");
  await tool.handler({ language: "python-head", code: "print('ok')" }, mockEnv());
  assert.equal(compileBody.compiler, "python-head");
});

test("run_code: non-zero exit code is passed through", async () => {
  let n = 0;
  globalThis.fetch = (async () => {
    n += 1;
    if (n === 1) return jsonResponse([pythonCompiler]);
    return jsonResponse({ status: "3", program_output: "", program_error: "boom" });
  }) as any;
  const tool = findTool("run_code");
  const result: any = await tool.handler({ language: "python", code: "raise SystemExit(3)" }, mockEnv());
  assert.equal(result.run.code, 3);
  assert.equal(result.run.stderr, "boom");
});

test("run_code: compiler errors become stderr with non-zero compatible code", async () => {
  let n = 0;
  globalThis.fetch = (async () => {
    n += 1;
    if (n === 1) return jsonResponse([{ name: "gcc-head-c", language: "C", version: "17", "runtime-option-raw": false }]);
    return jsonResponse({ status: "0", compiler_error: "syntax error", program_output: "" });
  }) as any;
  const tool = findTool("run_code");
  const result: any = await tool.handler({ language: "c", code: "not c" }, mockEnv());
  assert.equal(result.run.code, 1);
  assert.equal(result.run.stderr, "syntax error");
  assert.equal(result.compile.stderr, "syntax error");
});

test("run_code: runtime args use Wandbox runtime-option-raw when supported", async () => {
  let compileBody: any = null;
  globalThis.fetch = (async (url: any, init: any = {}) => {
    if (String(url).endsWith("/list.json")) return jsonResponse([pythonCompiler]);
    compileBody = JSON.parse(String(init.body));
    return jsonResponse({ status: 0, program_output: "" });
  }) as any;
  const tool = findTool("run_code");
  await tool.handler({ language: "python", code: "pass", args: ["one", "two"] }, mockEnv());
  assert.equal(compileBody["runtime-option-raw"], "one\ntwo");
});

test("run_code: runtime args fail closed when selected compiler does not support them", async () => {
  globalThis.fetch = (async () => jsonResponse([{ name: "python-stable", language: "Python", version: "3.12", "runtime-option-raw": false }])) as any;
  const tool = findTool("run_code");
  await assert.rejects(
    () => tool.handler({ language: "python", code: "pass", args: ["one"] }, mockEnv()),
    /does not support runtime arguments/,
  );
});

test("run_code: Wandbox HTTP error surfaces with status", async () => {
  globalThis.fetch = (async () => jsonResponse({ message: "unavailable" }, 503)) as any;
  const tool = findTool("run_code");
  await assert.rejects(() => tool.handler({ language: "python", code: "x" }, mockEnv()), /Wandbox API error \(503\)/);
});

test("run_code: validation — missing language throws", async () => {
  const tool = findTool("run_code");
  await assert.rejects(() => tool.handler({ code: "print(1)" }, mockEnv()), /language is required/);
});

test("run_code: validation — empty code throws", async () => {
  const tool = findTool("run_code");
  await assert.rejects(() => tool.handler({ language: "python", code: "   " }, mockEnv()), /code is empty/);
});

test("run_code: validation — code over 200KB throws", async () => {
  const tool = findTool("run_code");
  const big = "x".repeat(200_001);
  await assert.rejects(
    () => tool.handler({ language: "python", code: big }, mockEnv()),
    /exceeds 200 KB sandbox limit/,
  );
});

// ---------------------------------------------------------------------------
// list_code_runtimes (Wandbox)
// ---------------------------------------------------------------------------

test("list_code_runtimes: returns the live Wandbox compiler list", async () => {
  globalThis.fetch = (async () => jsonResponse([pythonCompiler])) as any;
  const tool = findTool("list_code_runtimes");
  const result: any = await tool.handler({}, mockEnv());
  assert.equal(result[0].name, "python-head");
  assert.equal(result[0].language, "Python");
});

test("list_code_runtimes: Wandbox HTTP error throws", async () => {
  globalThis.fetch = (async () => new Response("", { status: 503 })) as any;
  const tool = findTool("list_code_runtimes");
  await assert.rejects(() => tool.handler({}, mockEnv()), /Wandbox API error \(503\)/);
});

'''
          p.write_text(s[:start] + replacement + s[end:])

          p = Path('scripts/exec_tools_live_smoke.py')
          s = p.read_text()
          s = s.replace('Piston for run_code/list_code_runtimes', 'Wandbox for run_code/list_code_runtimes')
          s = s.replace('PASS: list_code_runtimes live Piston lookup', 'PASS: list_code_runtimes live Wandbox lookup')
          s = s.replace('expected Piston result.run object', 'expected Wandbox-compatible result.run object')
          s = s.replace('PISTON_MCP_EXEC_OK', 'WANDBOX_MCP_EXEC_OK')
          s = s.replace('Piston run_code stdout', 'Wandbox run_code stdout')
          p.write_text(s)
          PY

      - name: Verify migration
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          python3 -m py_compile scripts/exec_tools_live_smoke.py

      - name: Commit verified migration
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add src/index.ts src/code-execution/wandbox.ts test/exec-tools.test.ts scripts/exec_tools_live_smoke.py
          git commit -m "feat: migrate run_code backend from Piston to Wandbox"
          git push origin HEAD:feat/wandbox-code-runner
