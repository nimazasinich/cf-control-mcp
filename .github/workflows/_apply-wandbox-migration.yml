name: Apply Wandbox migration

on:
  push:
    branches:
      - feat/wandbox-code-runner
    paths:
      - .github/workflows/_apply-wandbox-migration.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wandbox-code-runner
      - run: echo "workflow-smoke-ok"
