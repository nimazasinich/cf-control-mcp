name: Apply provider health evidence fix

on:
  push:
    branches: [release/v1.8.0-final-verified-20260916]
    paths:
      - '.github/workflows/apply-health-evidence-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/admin/router.ts')
          s = p.read_text(encoding='utf-8')

          old_import = 'import { testGoogleAiStudio } from "./health";'
          new_import = 'import { testGoogleAiStudio, type HealthResult } from "./health";'
          if s.count(old_import) != 1:
              raise SystemExit(f'health import anchor count={s.count(old_import)}, expected 1')
          s = s.replace(old_import, new_import, 1)

          marker = '''function json(data: unknown, status = 200): Response {\n\treturn new Response(JSON.stringify(data), { status, headers: { "Content-Type": "application/json" } });\n}\n'''
          helper = marker + '''\nfunction providerHealthEvidence(result: Partial<HealthResult>) {\n\treturn {\n\t\thttpStatus: result.httpStatus ?? null,\n\t\tgatewayLogId: result.gatewayLogId ?? null,\n\t\tgatewayStep: result.gatewayStep ?? null,\n\t\tcfRay: result.cfRay ?? null,\n\t};\n}\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'json helper anchor count={s.count(marker)}, expected 1')
          s = s.replace(marker, helper, 1)

          replacements = [
              (
                  'await recordHealthResult(env, id, result.state, result.latencyMs, result.errorMessage);',
                  'await recordHealthResult(env, id, result.state, result.latencyMs, result.errorMessage, providerHealthEvidence(result));',
              ),
              (
                  'await recordHealthResult(env, id, health.state, health.latencyMs, health.errorMessage);',
                  'await recordHealthResult(env, id, health.state, health.latencyMs, health.errorMessage, providerHealthEvidence(health));',
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'recordHealthResult anchor count={s.count(old)} for {old!r}, expected 1')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8', newline='')
          PY
          git diff --check
          git diff -- src/admin/router.ts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build tests
        run: npm run build:test

      - name: Green — targeted health evidence regression
        run: node --test build-test/test/admin-health-evidence.test.js

      - name: Green — full suite
        run: npm test

      - name: Release gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_migrations_local.py
          node scripts/check-version-sync.mjs
          npx wrangler deploy --dry-run

      - name: Commit only verified source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.email 'actions@github.com'
          git config user.name 'release-bot'
          git add src/admin/router.ts
          git diff --cached --check
          git diff --cached --quiet && { echo 'FAIL: expected router fix is empty'; exit 1; }
          git commit -m 'fix: persist provider gateway health evidence'
          git push origin HEAD:release/v1.8.0-final-verified-20260916
