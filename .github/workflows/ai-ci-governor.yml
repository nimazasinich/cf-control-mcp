name: AI CI Governor

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Authoritative owner branch to analyze"
        required: true
        type: string
      pr_number:
        description: "Optional PR number"
        required: false
        type: string
      failed_run_id:
        description: "Optional failed CI run id"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-ci-governor-${{ github.event.workflow_run.head_branch || inputs.branch || github.run_id }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch != github.event.repository.default_branch &&
       (github.event.workflow_run.actor.login == github.repository_owner ||
        github.event.workflow_run.actor.login == 'github-actions[bot]')) ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.meta.outputs.branch }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      pr: ${{ steps.meta.outputs.pr }}
      failed_run: ${{ steps.meta.outputs.failed_run }}
      run_attempt: ${{ steps.meta.outputs.run_attempt }}
      runtime_status: ${{ steps.final.outputs.runtime_status }}
      has_changes: ${{ steps.final.outputs.has_changes }}
      artifact_ready: ${{ steps.final.outputs.artifact_ready }}
      classifications: ${{ steps.final.outputs.classifications }}
      confidence: ${{ steps.final.outputs.confidence }}
      requires_human: ${{ steps.final.outputs.requires_human }}
      critic_verdict: ${{ steps.final.outputs.critic_verdict }}
      transient_only: ${{ steps.final.outputs.transient_only }}
    steps:
      - name: Resolve target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
          WF_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DISPATCH_BRANCH: ${{ inputs.branch }}
          DISPATCH_PR: ${{ inputs.pr_number }}
          DISPATCH_RUN: ${{ inputs.failed_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            branch="$WF_BRANCH"
            pr="$WF_PR"
            failed_run="$WF_RUN_ID"
            run_attempt="${WF_ATTEMPT:-1}"
          else
            branch="$DISPATCH_BRANCH"
            pr="$DISPATCH_PR"
            failed_run="$DISPATCH_RUN"
            run_attempt="1"
          fi
          if [[ -z "$branch" || "$branch" == "$DEFAULT_BRANCH" ]]; then
            echo "Refusing an empty/default branch." >&2
            exit 2
          fi
          if [[ "$branch" == refs/* || "$branch" == -* || "$branch" == *$'\n'* ]]; then
            echo "Unsafe branch value." >&2
            exit 2
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "failed_run=$failed_run" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"
          echo "default_branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout authoritative head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Resolve exact source and repair budget
        id: meta
        shell: bash
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          FAILED_RUN: ${{ steps.target.outputs.failed_run }}
          RUN_ATTEMPT: ${{ steps.target.outputs.run_attempt }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          source_sha="$(git rev-parse HEAD)"
          count="$(git log "origin/$DEFAULT_BRANCH..HEAD" --format=%s | grep -c '^fix(ai-ci-governor):' || true)"
          if [[ "$count" -ge 3 ]]; then
            budget=false
          else
            budget=true
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "failed_run=$FAILED_RUN" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "budget=$budget" >> "$GITHUB_OUTPUT"

      - name: Collect bounded evidence
        if: steps.meta.outputs.budget == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          PR_NUMBER: ${{ steps.meta.outputs.pr }}
          FAILED_RUN: ${{ steps.meta.outputs.failed_run }}
          DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p .ai-governor
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('.ai-governor/context.json').write_text(json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'],
              'authoritative_branch': os.environ['BRANCH'],
              'source_sha': os.environ['SOURCE_SHA'],
              'default_branch': os.environ['DEFAULT_BRANCH'],
              'pr_number': os.environ.get('PR_NUMBER',''),
              'failed_run': os.environ.get('FAILED_RUN',''),
              'policy': 'GEMINI.md',
          }, indent=2, sort_keys=True))
          PY
          git log --oneline --decorate -40 > .ai-governor/recent-commits.txt
          git diff --stat "origin/$DEFAULT_BRANCH...HEAD" > .ai-governor/head-vs-default-stat.txt
          git diff --name-status "origin/$DEFAULT_BRANCH...HEAD" > .ai-governor/head-vs-default-files.txt
          merge_base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          git merge-tree "$merge_base" HEAD "origin/$DEFAULT_BRANCH" > .ai-governor/merge-tree.txt || true
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json number,title,body,headRefName,headRefOid,baseRefName,mergeStateStatus,mergeable,statusCheckRollup \
              > .ai-governor/pr.json || true
          fi
          if [[ -n "$FAILED_RUN" ]]; then
            gh run view "$FAILED_RUN" --repo "$GITHUB_REPOSITORY" --log-failed \
              > .ai-governor/failed.raw.log 2>&1 || \
            gh run view "$FAILED_RUN" --repo "$GITHUB_REPOSITORY" --log \
              > .ai-governor/failed.raw.log 2>&1 || true
            python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('.ai-governor/failed.raw.log')
          s=p.read_text(errors='replace') if p.exists() else ''
          patterns=[
              (r'(?i)(authorization:\s*)(?:bearer\s+|basic\s+)?\S+', r'\1[REDACTED]'),
              (r'(?i)((?:token|secret|api[_-]?key|password)\s*[=:]\s*)\S+', r'\1[REDACTED]'),
              (r'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b', '[REDACTED_JWT]'),
          ]
          for pat,repl in patterns: s=re.sub(pat,repl,s)
          Path('.ai-governor/failed.log').write_text(s[-120000:])
          p.unlink(missing_ok=True)
          PY
          fi

      - name: Install project dependencies for agent checks
        if: steps.meta.outputs.budget == 'true'
        id: deps
        continue-on-error: true
        shell: bash
        run: npm ci

      - name: Load trusted Governor runner from default branch
        if: steps.meta.outputs.budget == 'true'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ steps.target.outputs.default_branch }}
        run: |
          set -euo pipefail
          git show "origin/$DEFAULT_BRANCH:scripts/ai_ci_governor.py" > "$RUNNER_TEMP/ai_ci_governor.py"
          python3 -m py_compile "$RUNNER_TEMP/ai_ci_governor.py"

      - name: Check free Gemini API key
        id: auth
        if: steps.meta.outputs.budget == 'true'
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ -n "$GEMINI_API_KEY" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            mkdir -p .ai-governor
            printf '%s\n' '{"status":"MISSING_KEY"}' > .ai-governor/runtime.json
          fi

      - name: Run free repair reasoner
        id: repair
        if: steps.meta.outputs.budget == 'true' && steps.auth.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOVERNOR_MODEL: ${{ vars.AI_CI_GOVERNOR_MODEL || 'gemini-3.7-flash' }}
        run: python3 "$RUNNER_TEMP/ai_ci_governor.py" repair

      - name: Detect candidate source changes
        id: changed
        if: steps.meta.outputs.budget == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -N -- . 2>/dev/null || true
          git status --short
          if [[ -n "$(git diff --name-only HEAD)" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run independent read-only critic
        id: critic
        if: >-
          steps.meta.outputs.budget == 'true' &&
          steps.auth.outputs.ready == 'true' &&
          steps.changed.outputs.value == 'true' &&
          hashFiles('.ai-governor/decision.json') != ''
        continue-on-error: true
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOVERNOR_MODEL: ${{ vars.AI_CI_GOVERNOR_MODEL || 'gemini-3.7-flash' }}
        run: python3 "$RUNNER_TEMP/ai_ci_governor.py" critic

      - name: Finalize structured proposal
        id: final
        if: always() && steps.meta.outputs.budget == 'true'
        shell: bash
        env:
          HAS_CHANGES: ${{ steps.changed.outputs.value }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def load(name, default):
              p=Path('.ai-governor')/name
              if not p.exists(): return default
              try: return json.loads(p.read_text())
              except Exception: return default
          runtime=load('runtime.json', {'status':'NO_RUNTIME'})
          decision=load('decision.json', {})
          critic=load('critic.json', {})
          classes=decision.get('classifications', []) if isinstance(decision,dict) else []
          conf=float(decision.get('confidence',0) or 0) if isinstance(decision,dict) else 0
          human=bool(decision.get('requires_human',True)) if isinstance(decision,dict) else True
          changes=os.environ.get('HAS_CHANGES')=='true'
          verdict=str(critic.get('verdict','NONE')) if isinstance(critic,dict) else 'NONE'
          ready=(runtime.get('status')=='OK' and changes and not human and verdict=='ACCEPT')
          transient_only=bool(classes) and set(classes) <= {'FLAKE'}
          out=os.environ['GITHUB_OUTPUT']
          with open(out,'a') as f:
              f.write(f"runtime_status={runtime.get('status','UNKNOWN')}\n")
              f.write(f"has_changes={'true' if changes else 'false'}\n")
              f.write(f"artifact_ready={'true' if ready else 'false'}\n")
              f.write('classifications='+json.dumps(classes,separators=(',',':'))+'\n')
              f.write(f"confidence={conf:.4f}\n")
              f.write(f"requires_human={'true' if human else 'false'}\n")
              f.write(f"critic_verdict={verdict}\n")
              f.write(f"transient_only={'true' if transient_only else 'false'}\n")
          PY

      - name: Build exact repair artifact
        if: steps.final.outputs.artifact_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .governor-artifact
          git diff --binary HEAD > .governor-artifact/repair.patch
          cp .ai-governor/decision.json .governor-artifact/decision.json
          cp .ai-governor/critic.json .governor-artifact/critic.json
          cp .ai-governor/context.json .governor-artifact/context.json
          test -s .governor-artifact/repair.patch

      - name: Upload repair artifact
        if: steps.final.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-ci-repair-${{ steps.meta.outputs.source_sha }}
          path: .governor-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: propose
    if: needs.propose.outputs.artifact_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact analyzed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.propose.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Download proposed repair
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-ci-repair-${{ needs.propose.outputs.source_sha }}
          path: .governor-in

      - name: Enforce mutation policy
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .governor-in/repair.patch
          git apply .governor-in/repair.patch
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          d=json.loads(Path('.governor-in/decision.json').read_text())
          c=json.loads(Path('.governor-in/critic.json').read_text())
          classes=set(d.get('classifications',[])); conf=float(d.get('confidence',0) or 0)
          if c.get('verdict')!='ACCEPT': raise SystemExit('critic did not ACCEPT')
          if d.get('requires_human',True): raise SystemExit('decision requires human')
          files=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          if not files: raise SystemExit('empty patch')
          protected={'GEMINI.md','SECURITY.md','package.json','package-lock.json','wrangler.toml',
                     '.github/CODEOWNERS','.github/workflows/ai-ci-governor.yml','scripts/ai_ci_governor.py'}
          for f in files:
              if f in protected: raise SystemExit(f'protected control-plane file: {f}')
              if f.startswith('.github/') and f!='.github/workflows/ci.yml':
                  raise SystemExit(f'GitHub control-plane file is protected: {f}')
          if '.github/workflows/ci.yml' in files:
              if 'STALE_CI' not in classes: raise SystemExit('ci.yml requires STALE_CI classification')
              if not d.get('ci_contract_change',False): raise SystemExit('ci.yml requires ci_contract_change=true')
              if conf < 0.80: raise SystemExit('ci.yml change requires confidence >= 0.80')
          if classes and classes <= {'INFRA','QUOTA','FLAKE'}:
              raise SystemExit('transient-only diagnosis cannot mutate source')
          if conf < 0.60: raise SystemExit('repair confidence below 0.60')
          print('policy accepted:', ', '.join(files))
          PY

      - name: Compile Governor control script
        run: python3 -m py_compile scripts/ai_ci_governor.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Full tests
        run: npm test

      - name: Migration contract
        run: python3 scripts/verify_migrations_local.py

      - name: Version contract
        run: node scripts/check-version-sync.mjs

      - name: Worker dry-run build
        run: npx wrangler deploy --dry-run

  apply:
    needs: [propose, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.propose.outputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Abort if branch moved
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.propose.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "Branch moved: expected $EXPECTED_SHA, got $actual" >&2
            exit 3
          }

      - name: Download verified repair
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ai-ci-repair-${{ needs.propose.outputs.source_sha }}
          path: .governor-in

      - name: Apply exact verified patch and push
        shell: bash
        env:
          BRANCH: ${{ needs.propose.outputs.branch }}
          CLASSIFICATIONS: ${{ needs.propose.outputs.classifications }}
        run: |
          set -euo pipefail
          git apply --check .governor-in/repair.patch
          git apply .governor-in/repair.patch
          git config user.name "Adaptive CI Governor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai-ci-governor): evidence-backed ${CLASSIFICATIONS}"
          git push origin "HEAD:$BRANCH"

      - name: Explicitly redispatch CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.propose.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  retry_flake:
    needs: propose
    if: >-
      needs.propose.result == 'success' &&
      needs.propose.outputs.has_changes == 'false' &&
      needs.propose.outputs.requires_human == 'false' &&
      needs.propose.outputs.transient_only == 'true' &&
      fromJSON(needs.propose.outputs.confidence) >= 0.85 &&
      needs.propose.outputs.run_attempt == '1' &&
      needs.propose.outputs.failed_run != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Perform one unchanged failed-job retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN: ${{ needs.propose.outputs.failed_run }}
        run: gh run rerun "$FAILED_RUN" --repo "$GITHUB_REPOSITORY" --failed

  report:
    needs: [propose, verify, apply, retry_flake]
    if: always() && needs.propose.result != 'skipped' && needs.propose.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Report evidence-backed outcome
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.propose.outputs.pr }}
          RUNTIME_STATUS: ${{ needs.propose.outputs.runtime_status }}
          CLASSES: ${{ needs.propose.outputs.classifications }}
          CONFIDENCE: ${{ needs.propose.outputs.confidence }}
          HUMAN: ${{ needs.propose.outputs.requires_human }}
          CRITIC: ${{ needs.propose.outputs.critic_verdict }}
          HAS_CHANGES: ${{ needs.propose.outputs.has_changes }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          APPLY_RESULT: ${{ needs.apply.result }}
          RETRY_RESULT: ${{ needs.retry_flake.result }}
        run: |
          if [[ "$APPLY_RESULT" == "success" ]]; then
            msg="🤖 Adaptive CI Governor applied an independently criticized and deterministically verified repair (${CLASSES}, confidence ${CONFIDENCE}). CI was explicitly dispatched on the repaired branch."
          elif [[ "$RETRY_RESULT" == "success" ]]; then
            msg="🤖 Adaptive CI Governor classified this as a high-confidence FLAKE and requested one unchanged failed-job retry. A retry PASS is still flake evidence, not a first-run PASS."
          elif [[ "$RUNTIME_STATUS" == "MISSING_KEY" ]]; then
            msg="🤖 Adaptive CI Governor is installed but BLOCKED: repository secret GEMINI_API_KEY is missing. No source or CI policy was changed."
          elif [[ "$RUNTIME_STATUS" == "QUOTA" ]]; then
            msg="🤖 Adaptive CI Governor is QUOTA-blocked on the free Gemini tier. It did not fall back to a paid model and made no verified repair."
          elif [[ "$VERIFY_RESULT" == "failure" ]]; then
            msg="🤖 Adaptive CI Governor proposed a repair (${CLASSES}, confidence ${CONFIDENCE}), but the independent deterministic verification kernel rejected it. Nothing was pushed."
          elif [[ "$CRITIC" == "REJECT" || "$CRITIC" == "ESCALATE" ]]; then
            msg="🤖 Adaptive CI Governor proposed changes, but the independent critic returned ${CRITIC}. Nothing was pushed."
          elif [[ "$HUMAN" == "true" ]]; then
            msg="🤖 Adaptive CI Governor classified the failure as ${CLASSES} but marked the evidence insufficient/risky for autonomous mutation. Human direction is required."
          elif [[ "$HAS_CHANGES" == "false" ]]; then
            msg="🤖 Adaptive CI Governor analyzed the failure (${CLASSES}, confidence ${CONFIDENCE}) and produced no source/CI mutation. No PASS is being claimed."
          else
            msg="🤖 Adaptive CI Governor did not produce an applicable verified repair. Runtime=${RUNTIME_STATUS}, critic=${CRITIC}, verify=${VERIFY_RESULT}. No PASS is being claimed."
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$msg"
