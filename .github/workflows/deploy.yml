name: Deploy MCP server to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account ID
        id: account
        run: |
          ACCOUNT_ID=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=1" | \
            python3 -c "import json,sys;d=json.load(sys.stdin);print(d['result'][0]['id'])")
          echo "id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.account.outputs.id }}
          command: deploy

      - name: Push Worker secrets
        run: |
          npx wrangler secret put MCP_AUTH_TOKEN --name cf-control-mcp <<< "${MCP_AUTH_TOKEN}"
          npx wrangler secret put CLOUDFLARE_API_TOKEN --name cf-control-mcp <<< "${CLOUDFLARE_API_TOKEN}"
          npx wrangler secret put CLOUDFLARE_ACCOUNT_ID --name cf-control-mcp <<< "${ACCOUNT_ID}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          ACCOUNT_ID: ${{ steps.account.outputs.id }}
