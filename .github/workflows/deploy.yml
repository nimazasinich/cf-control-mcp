name: Deploy MCP server to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'scripts/oauth_smoke.py'
      - 'scripts/verify_production.py'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate required production secrets
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_AUTH_TOKEN: ${{ secrets.GATEWAY_AUTH_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in MCP_AUTH_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GATEWAY_AUTH_TOKEN CF_AIG_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_REQUIRED_SECRET: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: all required production secrets are configured"

      - name: Verify management token has access to the explicit account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/account.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}")
          if [ "$code" != "200" ]; then
            echo "FAIL: management token cannot access configured CLOUDFLARE_ACCOUNT_ID (HTTP $code)"
            exit 1
          fi
          echo "PASS: management token can access configured account"

      - name: Deploy Worker and push required/optional secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GATEWAY_AUTH_TOKEN: ${{ secrets.GATEWAY_AUTH_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
          GH_PAT: ${{ secrets.GH_RUNNER_PAT }}
          GH_REPO: ${{ secrets.GH_RUNNER_REPO }}
          BRAVE_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          set -euo pipefail
          exec > >(tee deploy.log) 2>&1

          echo "=== wrangler deploy ==="
          CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler deploy

          echo "=== pushing required Worker secrets ==="
          printf '%s' "$MCP_AUTH_TOKEN" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put MCP_AUTH_TOKEN
          printf '%s' "$CF_TOKEN" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put CLOUDFLARE_API_TOKEN
          printf '%s' "$ACCOUNT_ID" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put CLOUDFLARE_ACCOUNT_ID
          printf '%s' "$GATEWAY_AUTH_TOKEN" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put GATEWAY_AUTH_TOKEN
          printf '%s' "$CF_AIG_TOKEN" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put CF_AIG_TOKEN

          echo "=== pushing optional integration secrets ==="
          if [ -n "$HF_TOKEN" ]; then
            printf '%s' "$HF_TOKEN" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put HUGGINGFACE_TOKEN
          fi
          if [ -n "$GOOGLE_AI_STUDIO_KEY" ]; then
            echo "WARNING: GOOGLE_AI_STUDIO_KEY legacy break-glass secret is configured"
            printf '%s' "$GOOGLE_AI_STUDIO_KEY" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put GOOGLE_AI_STUDIO_KEY
          fi
          if [ -n "$GH_PAT" ]; then
            printf '%s' "$GH_PAT" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put GITHUB_PAT
          fi
          if [ -n "$GH_REPO" ]; then
            printf '%s' "$GH_REPO" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put GITHUB_REPO
          fi
          if [ -n "$BRAVE_KEY" ]; then
            printf '%s' "$BRAVE_KEY" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put BRAVE_SEARCH_API_KEY
          fi
          if [ -n "$TAVILY_KEY" ]; then
            printf '%s' "$TAVILY_KEY" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put TAVILY_API_KEY
          fi
          if [ -n "$EXA_KEY" ]; then
            printf '%s' "$EXA_KEY" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler secret put EXA_API_KEY
          fi

      - name: Verify live OAuth/MCP and full production acceptance
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_AUTH_TOKEN: ${{ secrets.GATEWAY_AUTH_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          HF_LIVE_CHECK: ${{ secrets.HUGGINGFACE_TOKEN != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          exec > >(tee -a deploy.log) 2>&1
          echo "=== live OAuth/MCP verification ==="
          MCP_BASE_URL="https://cf-control-mcp.amin-chinisaz-edu.workers.dev" python3 scripts/oauth_smoke.py
          echo "=== full production acceptance ==="
          python3 scripts/verify_production.py

      - name: Commit deploy log
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "deploy-bot"
          git add -f deploy.log
          git commit -m "chore: deploy log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

# ProxyHarvest MCP v1.2 live redeploy trigger
