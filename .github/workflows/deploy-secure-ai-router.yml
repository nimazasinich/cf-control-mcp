name: Deploy secure-ai-router Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'secure-ai-router/**'
      - '.github/workflows/deploy-secure-ai-router.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-ai-router
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set required Worker secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STORAGE_KEY: ${{ secrets.SECURE_ROUTER_STORAGE_KEY }}
          BOOTSTRAP:   ${{ secrets.SECURE_ROUTER_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$STORAGE_KEY" ]; then
            printf '%s' "$STORAGE_KEY" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT" npx wrangler secret put STORAGE_ENCRYPTION_KEY
          fi
          if [ -n "$BOOTSTRAP" ]; then
            printf '%s' "$BOOTSTRAP" | CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT" npx wrangler secret put BOOTSTRAP_SECRET
          fi

      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://cf-control-mcp.amin-chinisaz-edu.workers.dev/api/health)
          echo "Health check: HTTP $code"
          [ "$code" = "200" ] && echo "PASS" || (echo "FAIL - got $code" && exit 1)
