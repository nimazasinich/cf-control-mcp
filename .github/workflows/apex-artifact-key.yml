name: APEX Secure Artifact Key

on:
  push:
    branches: [main]
    paths:
      - 'requests/apex-artifact-keys/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-artifact-key
  cancel-in-progress: false

jobs:
  prepare-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate pending artifact transport keys
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: python3 scripts/apex_artifact_key.py

      - name: Commit public/encrypted key state
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "apex-artifact-key"
          git add state/apex-artifact-keys/ || true
          if git diff --cached --quiet; then
            echo "No new artifact key state."
            exit 0
          fi
          git commit -m "chore(apex): record encrypted artifact transport key [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
