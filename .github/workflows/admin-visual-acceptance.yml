name: Admin Visual Acceptance Artifacts

on:
  push:
    branches:
      - feat/dreamworker-production-admin-ui
    paths:
      - "src/admin/**"
      - "test/admin-*.test.ts"
      - "scripts/render_admin_visuals.cjs"
      - "scripts/audit_admin_visuals.cjs"
      - "scripts/ai_ci_verify.py"
      - ".github/workflows/admin-visual-acceptance.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/admin/**"
      - "test/admin-*.test.ts"
      - "scripts/render_admin_visuals.cjs"
      - "scripts/audit_admin_visuals.cjs"
      - "scripts/ai_ci_verify.py"
      - ".github/workflows/admin-visual-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: 1368x753 screenshot generation
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact SHA checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "requested_exact_sha=$EXACT_SHA"
          echo "checked_out_sha=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXACT_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build test representation of production Admin HTML
        run: npm run build:test

      - name: Generate test-only deterministic fixture HTML
        run: |
          rm -rf admin-visual-artifacts
          node scripts/render_admin_visuals.cjs admin-visual-artifacts
          test -s admin-visual-artifacts/dashboard-fixture.html
          test -s admin-visual-artifacts/login-fixture.html
          test -s admin-visual-artifacts/production-dashboard.html
          test -s admin-visual-artifacts/production-login.html

      - name: Prove fixture-only markers are absent from production HTML
        run: |
          ! grep -F "VISUAL_ACCEPTANCE_FIXTURE_ONLY" admin-visual-artifacts/production-dashboard.html
          ! grep -F "VISUAL_ACCEPTANCE_FIXTURE_ONLY" admin-visual-artifacts/production-login.html
          ! grep -F "VISUAL TEST DATA" admin-visual-artifacts/production-dashboard.html
          ! grep -F "VISUAL TEST DATA" admin-visual-artifacts/production-login.html
          ! grep -F "data-visual-fixture" admin-visual-artifacts/production-dashboard.html
          ! grep -F "data-visual-fixture" admin-visual-artifacts/production-login.html

      - name: Run visual and reference contract hard gates
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(
            find build-test/test -maxdepth 1 -type f \
              \( -name 'admin-*-ui-contract.test.js' \
                 -o -name 'admin-approved-adapter-runtime-contract.test.js' \
                 -o -name 'admin-visual*.test.js' \
                 -o -name 'admin-fidelity*.test.js' \
                 -o -name 'admin-reference*.test.js' \) \
              -print | sort
          )
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No visual/reference contract tests were discovered." >&2
            exit 1
          fi
          printf 'Visual hard-gate test: %s\n' "${tests[@]}"
          node --test "${tests[@]}"

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No supported Chrome/Chromium binary found on runner" >&2
            exit 1
          fi
          echo "binary=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Capture exact 1368x753 surfaces
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.binary }}
        run: |
          set -euo pipefail
          ROOT="$PWD/admin-visual-artifacts"
          DASH="file://$ROOT/dashboard-fixture.html"
          LOGIN="file://$ROOT/login-fixture.html"
          mkdir -p "$ROOT/screenshots"

          capture() {
            local name="$1"
            local url="$2"
            local budget="${3:-3400}"
            echo "Capturing $name"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --allow-file-access-from-files \
              --hide-scrollbars \
              --force-device-scale-factor=1 \
              --window-size=1368,753 \
              --virtual-time-budget="$budget" \
              --screenshot="$ROOT/screenshots/$name.png" \
              "$url" >/tmp/chrome-$name.out 2>/tmp/chrome-$name.err || {
                cat /tmp/chrome-$name.err >&2
                exit 1
              }
          }

          capture login "$LOGIN" 1000
          capture loading "$DASH?visualState=loading#overview" 900
          capture loading-degraded "$DASH?visualState=degraded#overview" 3400
          capture overview "$DASH?visualState=normal#overview"
          capture providers "$DASH?visualState=normal#providers"
          capture models "$DASH?visualState=normal#models"
          capture routing "$DASH?visualState=normal#routing"
          capture mcp-tools "$DASH?visualState=normal#mcp-tools"
          capture health "$DASH?visualState=normal#health"
          capture usage "$DASH?visualState=normal#usage"
          capture audit "$DASH?visualState=normal#logs"
          capture settings-environment "$DASH?visualState=normal&settingsView=environment#settings"
          capture settings-security "$DASH?visualState=normal&settingsView=security#settings"
          capture settings-session "$DASH?visualState=normal&settingsView=session#settings"
          capture settings-boundary "$DASH?visualState=normal&settingsView=boundary#settings"
          capture overview-empty "$DASH?visualState=empty#overview"
          capture health-error "$DASH?visualState=health-error#health" 3900

      - name: Verify screenshot dimensions and write exact-SHA manifest
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const dir='admin-visual-artifacts/screenshots';
          const files=fs.readdirSync(dir).filter(f=>f.endsWith('.png')).sort();
          if(files.length<17) throw new Error(`expected at least 17 screenshots, found ${files.length}`);
          for(const file of files){
            const b=fs.readFileSync(path.join(dir,file));
            if(b.toString('ascii',1,4)!=='PNG') throw new Error(`${file}: not PNG`);
            const w=b.readUInt32BE(16),h=b.readUInt32BE(20);
            if(w!==1368||h!==753) throw new Error(`${file}: expected 1368x753, got ${w}x${h}`);
          }
          fs.writeFileSync('admin-visual-artifacts/SCREENSHOT_MANIFEST.txt',[
            `exact_sha=${process.env.EXACT_SHA}`,
            'viewport=1368x753',
            `screenshots=${files.length}`,
            ...files,
            '',
            'SCREENSHOTS GENERATED',
            'VISUAL ACCEPTANCE PASS requires inspection of the PNG artifact.',
          ].join('\n'));
          console.log(`Verified ${files.length} PNGs at 1368x753 for ${process.env.EXACT_SHA}`);
          NODE

      - name: Audit rendered runtime and page overflow — hard gate
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.binary }}
          EXACT_SHA: ${{ env.EXACT_SHA }}
        run: |
          set -euo pipefail
          node scripts/audit_admin_visuals.cjs admin-visual-artifacts

      - name: Publish overflow audit report to job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="admin-visual-artifacts/overflow-audit-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "overflow-audit-report.json was not produced (audit script likely crashed before writing it)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const r = require('./admin-visual-artifacts/overflow-audit-report.json');
          const lines = [];
          lines.push(`### Admin Visual Acceptance — overflow audit (${r.exactSha || 'unknown sha'})`);
          lines.push('');
          lines.push(`${r.totalPages - r.failedPages.length}/${r.totalPages} pages passed at ${r.viewport.width}x${r.viewport.height}`);
          lines.push('');
          lines.push('| page | result | runtime | overflow | overflow px (page) | overflow px (doc) | waited ms |');
          lines.push('|---|---|---|---|---|---|---|');
          for (const p of r.results) {
            const d = p.diagnostics;
            const pagePx = d && d.activePageMeasurement ? `${d.activePageMeasurement.overflowXpx}x${d.activePageMeasurement.overflowYpx}` : 'n/a';
            const docPx = d ? `${d.documentMeasurement.overflowXpx}x${d.documentMeasurement.overflowYpx}` : 'n/a';
            lines.push(`| ${p.name} | ${p.pass ? '✅' : '❌'} | ${d ? d.runtimeStatus : 'n/a'} | ${d ? d.overflowStatus : 'n/a'} | ${pagePx} | ${docPx} | ${p.waitedMs} |`);
          }
          if (r.failedPages.length) {
            lines.push('');
            lines.push(`**Failed:** ${r.failedPages.join(', ')}`);
          }
          console.log(lines.join('\n'));
          NODE

      - name: Run full candidate suite as non-visual regression evidence
        id: candidate_tests
        shell: bash
        run: |
          set +e
          npm test > /tmp/admin-visual-candidate-tests.log 2>&1
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          tail -n 160 /tmp/admin-visual-candidate-tests.log

      - name: Resolve exact comparison baseline
        id: baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ref=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ref="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            ref="$PUSH_BEFORE"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Differential no-new-regression verdict
        if: steps.candidate_tests.outputs.rc != '0' && steps.baseline.outputs.ref != ''
        shell: bash
        env:
          BASELINE_REF: ${{ steps.baseline.outputs.ref }}
          CANDIDATE_RC: ${{ steps.candidate_tests.outputs.rc }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_REF^{commit}"
          rm -rf .visual-baseline
          git worktree add --detach .visual-baseline "$BASELINE_REF"
          (
            cd .visual-baseline
            npm ci
            set +e
            npm test > /tmp/admin-visual-baseline-tests.log 2>&1
            echo $? > /tmp/admin-visual-baseline-tests.rc
            set -e
          )
          baseline_rc="$(cat /tmp/admin-visual-baseline-tests.rc)"
          python3 scripts/ai_ci_verify.py compare-tests \
            --baseline-log /tmp/admin-visual-baseline-tests.log \
            --candidate-log /tmp/admin-visual-candidate-tests.log \
            --baseline-rc "$baseline_rc" \
            --candidate-rc "$CANDIDATE_RC" \
            --out admin-visual-artifacts/differential-tests.json
          cat admin-visual-artifacts/differential-tests.json >> "$GITHUB_STEP_SUMMARY"
          git worktree remove --force .visual-baseline

      - name: Mark unclassified full-suite debt for manual dispatch
        if: steps.candidate_tests.outputs.rc != '0' && steps.baseline.outputs.ref == ''
        run: |
          echo "### General regression evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "Full suite is red, but this manual event has no exact comparison baseline. Visual hard gates remain authoritative for this artifact; no clean full-suite PASS is claimed." >> "$GITHUB_STEP_SUMMARY"

      - name: Record fully green full-suite evidence
        if: steps.candidate_tests.outputs.rc == '0'
        run: echo "Full repository suite PASS on this exact visual candidate." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-visual-1368x753-${{ env.EXACT_SHA }}
          path: admin-visual-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Acceptance boundary
        if: success()
        run: |
          echo "VISUAL HARD GATES PASS for exact branch SHA $EXACT_SHA"
          echo "17 canonical screenshots were generated at 1368x753 and overflow/reference contracts passed."
          echo "Repository-wide failures, if any, were evaluated separately through exact-baseline differential evidence; this step does not relabel baseline debt as a clean full-suite PASS."
