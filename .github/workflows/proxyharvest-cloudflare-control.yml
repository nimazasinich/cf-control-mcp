name: ProxyHarvest Cloudflare Control Bridge

on:
  push:
    branches: [main]
    paths:
      - 'requests/proxyharvest/*.json'
      - 'deploy/proxyharvest/**'
      - 'scripts/proxyharvest_cf_bridge.py'
      - '.github/workflows/proxyharvest-cloudflare-control.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxyharvest-cloudflare-control
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Cloudflare account ID
        id: account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=1" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('success') is True and d.get('result'); print(d['result'][0]['id'])")
          echo "id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Execute pending ProxyHarvest requests
        id: bridge
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/proxyharvest_cf_bridge.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}

      - name: Commit sanitized ProxyHarvest results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "proxyharvest-cloudflare-bridge"
          git add results/proxyharvest/ || true
          if git diff --cached --quiet; then
            echo "No new result files to commit."
            exit 0
          fi
          git commit -m "chore(proxyharvest): record Cloudflare bridge result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce bridge result
        if: always()
        shell: bash
        run: |
          test "${{ steps.bridge.outputs.exit_code }}" = "0"
