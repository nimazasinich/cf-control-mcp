name: Credential Audit (non-gating)

on:
  pull_request:
    paths:
      - '.github/workflows/credential-audit.yml'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit production credentials without exposing values
        shell: bash
        env:
          CF_AIG_AUTHORIZATION: ${{ secrets.CF_AIG_AUTHORIZATION }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          CF_TOKEN5: ${{ secrets.CF_TOKEN5 }}
          APEX_CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.APEX_CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GATEWAY_AUTH_TOKEN: ${{ secrets.GATEWAY_AUTH_TOKEN }}
          PROVIDER_GATEWAY_AUTH_TOKEN: ${{ secrets.PROVIDER_GATEWAY_AUTH_TOKEN }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          GITHUB_RUNNER_PAT: ${{ secrets.GITHUB_RUNNER_PAT }}
          GH_RUNNER_REPO: ${{ secrets.GH_RUNNER_REPO }}
          GITHUB_RUNNER_REPO: ${{ secrets.GITHUB_RUNNER_REPO }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          PROBE_ACCOUNT_ID2: ${{ secrets.PROBE_ACCOUNT_ID2 }}
          PROBE_TOKEN_F: ${{ secrets.PROBE_TOKEN_F }}
          PROBE_TOKEN_G: ${{ secrets.PROBE_TOKEN_G }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
        run: |
          set +e
          REPORT="$RUNNER_TEMP/credential-audit.md"
          : > "$REPORT"
          printf '%s\n' '# Credential Audit — redacted' '' '| Credential | Present | Live status | Evidence |' '|---|---:|---|---|' >> "$REPORT"

          mask_if_set() { [ -n "$2" ] && echo "::add-mask::$2"; }
          for n in CF_AIG_AUTHORIZATION CF_AIG_TOKEN CF_TOKEN5 APEX_CLOUDFLARE_DEPLOY_TOKEN CLOUDFLARE_API_TOKEN GATEWAY_AUTH_TOKEN PROVIDER_GATEWAY_AUTH_TOKEN GH_RUNNER_PAT GITHUB_RUNNER_PAT HUGGINGFACE_TOKEN MCP_AUTH_TOKEN PROBE_TOKEN_F PROBE_TOKEN_G VERCEL_TOKEN VERCEL_TEAM_TOKEN; do
            mask_if_set "$n" "${!n}"
          done

          row() {
            local name="$1" present="$2" status="$3" evidence="$4"
            evidence=$(printf '%s' "$evidence" | tr '\n\r|' '   ' | cut -c1-180)
            printf '| `%s` | %s | **%s** | %s |\n' "$name" "$present" "$status" "$evidence" >> "$REPORT"
          }

          cf_verify() {
            local name="$1" tok="$2" acct="$3"
            if [ -z "$tok" ]; then row "$name" no MISSING 'secret not configured'; return; fi
            code=$(curl -sS --max-time 20 -o /tmp/cfv.json -w '%{http_code}' -H "Authorization: Bearer $tok" https://api.cloudflare.com/client/v4/user/tokens/verify)
            state=$(python3 - <<'PY'
import json
try:
 d=json.load(open('/tmp/cfv.json')); print(d.get('result',{}).get('status','unknown'))
except Exception: print('parse_error')
PY
)
            if [ "$code" != 200 ] || [ "$state" != active ]; then row "$name" yes FAIL "token verify HTTP=$code status=$state"; return; fi
            if [ -n "$acct" ]; then
              acode=$(curl -sS --max-time 20 -o /tmp/cfa.json -w '%{http_code}' -H "Authorization: Bearer $tok" "https://api.cloudflare.com/client/v4/accounts/$acct")
              if [ "$acode" = 200 ]; then row "$name" yes PASS "active; account access HTTP=200"; else row "$name" yes PARTIAL "active; configured account access HTTP=$acode"; fi
            else
              row "$name" yes PASS "active token; no account supplied for scope test"
            fi
          }

          # Canonical management credential + scope probes.
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            cf_verify CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_ACCOUNT_ID"
            for spec in \
              "Workers|https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
              "D1|https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              "AI_Gateway|https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-gateway/gateways" \
              "Secrets_Store|https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores"; do
              label=${spec%%|*}; url=${spec#*|}
              code=$(curl -sS --max-time 20 -o /tmp/cfscope.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url")
              row "CLOUDFLARE_API_TOKEN:$label" yes "$([ "$code" = 200 ] && echo PASS || echo FAIL)" "HTTP=$code"
            done
          else
            row CLOUDFLARE_API_TOKEN no MISSING 'secret not configured'
          fi

          # Account ID is not a credential; validate it against management auth.
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            code=$(curl -sS --max-time 20 -o /tmp/acct.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
            row CLOUDFLARE_ACCOUNT_ID yes "$([ "$code" = 200 ] && echo PASS || echo FAIL)" "validated by management token; HTTP=$code"
          else
            row CLOUDFLARE_ACCOUNT_ID "$([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo yes || echo no)" BLOCKED 'requires account ID + management token'
          fi

          # AI Gateway runtime auth: test both legacy and canonical names independently.
          test_aig() {
            local name="$1" tok="$2"
            if [ -z "$tok" ]; then row "$name" no MISSING 'secret not configured'; return; fi
            code=$(curl -sS --max-time 35 -o /tmp/aig.json -w '%{http_code}' \
              -X POST "https://gateway.ai.cloudflare.com/v1/$CLOUDFLARE_ACCOUNT_ID/cf-control-mcp/compat/chat/completions" \
              -H 'Content-Type: application/json' -H "cf-aig-authorization: Bearer $tok" \
              --data '{"model":"google-ai-studio/gemini-3.6-flash","messages":[{"role":"user","content":"Reply AIG_OK"}],"max_tokens":8}')
            choices=$(python3 - <<'PY'
import json
try:
 d=json.load(open('/tmp/aig.json')); print(len(d.get('choices',[])))
except Exception: print(0)
PY
)
            row "$name" yes "$([ "$code" = 200 ] && [ "$choices" -gt 0 ] && echo PASS || echo FAIL)" "real BYOK inference HTTP=$code choices=$choices"
          }
          test_aig CF_AIG_AUTHORIZATION "$CF_AIG_AUTHORIZATION"
          test_aig CF_AIG_TOKEN "$CF_AIG_TOKEN"

          # APEX / probe Cloudflare credentials. Old APEX workflows reference account d902... explicitly.
          cf_verify CF_TOKEN5 "$CF_TOKEN5" "d902b91f0f1076e0601ffd6e7b4382c0"
          cf_verify APEX_CLOUDFLARE_DEPLOY_TOKEN "$APEX_CLOUDFLARE_DEPLOY_TOKEN" "d902b91f0f1076e0601ffd6e7b4382c0"
          cf_verify PROBE_TOKEN_F "$PROBE_TOKEN_F" "$PROBE_ACCOUNT_ID2"
          cf_verify PROBE_TOKEN_G "$PROBE_TOKEN_G" "$PROBE_ACCOUNT_ID2"
          if [ -n "$PROBE_ACCOUNT_ID2" ]; then row PROBE_ACCOUNT_ID2 yes INFO 'identifier present; paired with F/G probe tokens'; else row PROBE_ACCOUNT_ID2 no MISSING 'not configured'; fi

          # Provider Gateway auth: /v1/models is auth-only and does not require inference.
          test_gateway() {
            local name="$1" tok="$2"
            if [ -z "$tok" ]; then row "$name" no MISSING 'secret not configured'; return; fi
            code=$(curl -sS --max-time 20 -o /tmp/gw.json -w '%{http_code}' -H "Authorization: Bearer $tok" https://cf-control-mcp.amin-chinisaz-edu.workers.dev/v1/models)
            count=$(python3 - <<'PY'
import json
try:
 d=json.load(open('/tmp/gw.json')); print(len(d.get('data',[])))
except Exception: print(0)
PY
)
            row "$name" yes "$([ "$code" = 200 ] && [ "$count" -gt 0 ] && echo PASS || echo FAIL)" "/v1/models HTTP=$code models=$count"
          }
          test_gateway GATEWAY_AUTH_TOKEN "$GATEWAY_AUTH_TOKEN"
          test_gateway PROVIDER_GATEWAY_AUTH_TOKEN "$PROVIDER_GATEWAY_AUTH_TOKEN"

          # MCP auth + protocol/tool inventory.
          if [ -n "$MCP_AUTH_TOKEN" ]; then
            code=$(curl -sS --max-time 20 -o /tmp/mcpi.json -w '%{http_code}' -X POST https://cf-control-mcp.amin-chinisaz-edu.workers.dev/mcp -H "Authorization: Bearer $MCP_AUTH_TOKEN" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"credential-audit","version":"1"}}}')
            pv=$(python3 - <<'PY'
import json
try:
 d=json.load(open('/tmp/mcpi.json')); print(d.get('result',{}).get('protocolVersion',''))
except Exception: print('')
PY
)
            tcode=$(curl -sS --max-time 20 -o /tmp/mcpt.json -w '%{http_code}' -X POST https://cf-control-mcp.amin-chinisaz-edu.workers.dev/mcp -H "Authorization: Bearer $MCP_AUTH_TOKEN" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
            tools=$(python3 - <<'PY'
import json
try:
 d=json.load(open('/tmp/mcpt.json')); print(len(d.get('result',{}).get('tools',[])))
except Exception: print(0)
PY
)
            row MCP_AUTH_TOKEN yes "$([ "$code" = 200 ] && [ "$tcode" = 200 ] && [ "$tools" -gt 0 ] && echo PASS || echo FAIL)" "initialize HTTP=$code protocol=$pv; tools/list HTTP=$tcode count=$tools"
          else row MCP_AUTH_TOKEN no MISSING 'secret not configured'; fi

          # Hugging Face.
          if [ -n "$HUGGINGFACE_TOKEN" ]; then
            code=$(curl -sS --max-time 20 -o /tmp/hf.json -w '%{http_code}' -H "Authorization: Bearer $HUGGINGFACE_TOKEN" https://huggingface.co/api/whoami-v2)
            row HUGGINGFACE_TOKEN yes "$([ "$code" = 200 ] && echo PASS || echo FAIL)" "whoami-v2 HTTP=$code"
          else row HUGGINGFACE_TOKEN no MISSING 'secret not configured'; fi

          # GitHub runner PAT/repo, old + canonical names.
          test_gh() {
            local n="$1" tok="$2" repo="$3"
            if [ -z "$tok" ]; then row "$n" no MISSING 'secret not configured'; return; fi
            ucode=$(curl -sS --max-time 20 -o /tmp/ghu.json -w '%{http_code}' -H "Authorization: Bearer $tok" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/user)
            if [ -n "$repo" ]; then
              clean=$(python3 - "$repo" <<'PY'
import sys,re
s=sys.argv[1].strip().rstrip('/')
s=re.sub(r'^https?://github\.com/','',s)
s=re.sub(r'^git@github\.com:','',s)
s=re.sub(r'\.git$','',s)
print(s)
PY
)
              rcode=$(curl -sS --max-time 20 -o /tmp/ghr.json -w '%{http_code}' -H "Authorization: Bearer $tok" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$clean")
            else rcode=0; fi
            row "$n" yes "$([ "$ucode" = 200 ] && { [ -z "$repo" ] || [ "$rcode" = 200 ]; } && echo PASS || echo FAIL)" "user HTTP=$ucode; repo HTTP=$rcode"
          }
          test_gh GH_RUNNER_PAT "$GH_RUNNER_PAT" "$GH_RUNNER_REPO"
          test_gh GITHUB_RUNNER_PAT "$GITHUB_RUNNER_PAT" "${GITHUB_RUNNER_REPO:-$GH_RUNNER_REPO}"
          if [ -n "$GH_RUNNER_REPO" ]; then row GH_RUNNER_REPO yes INFO 'identifier present; validated with GH_RUNNER_PAT above'; else row GH_RUNNER_REPO no MISSING 'not configured'; fi
          if [ -n "$GITHUB_RUNNER_REPO" ]; then row GITHUB_RUNNER_REPO yes INFO 'canonical identifier present'; else row GITHUB_RUNNER_REPO no MISSING 'canonical name not configured'; fi

          # Vercel tokens.
          test_vercel() {
            local n="$1" tok="$2"
            if [ -z "$tok" ]; then row "$n" no MISSING 'secret not configured'; return; fi
            code=$(curl -sS --max-time 20 -o /tmp/vercel.json -w '%{http_code}' -H "Authorization: Bearer $tok" https://api.vercel.com/v2/user)
            row "$n" yes "$([ "$code" = 200 ] && echo PASS || echo FAIL)" "/v2/user HTTP=$code"
          }
          test_vercel VERCEL_TOKEN "$VERCEL_TOKEN"
          test_vercel VERCEL_TEAM_TOKEN "$VERCEL_TEAM_TOKEN"

          cat "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Audit is intentionally non-gating; consult the matrix above.'
