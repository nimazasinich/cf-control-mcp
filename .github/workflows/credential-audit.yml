name: Credential Audit (non-gating)

on:
  pull_request:
    paths:
      - '.github/workflows/credential-audit.yml'
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit production credentials without exposing values
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AIG_AUTHORIZATION: ${{ secrets.CF_AIG_AUTHORIZATION }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          GATEWAY_AUTH_TOKEN: ${{ secrets.GATEWAY_AUTH_TOKEN }}
          PROVIDER_GATEWAY_AUTH_TOKEN: ${{ secrets.PROVIDER_GATEWAY_AUTH_TOKEN }}
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          GITHUB_RUNNER_PAT: ${{ secrets.GITHUB_RUNNER_PAT }}
          GITHUB_RUNNER_REPO: ${{ vars.GITHUB_RUNNER_REPO || secrets.GITHUB_RUNNER_REPO || secrets.GH_RUNNER_REPO }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
          CF_TOKEN5: ${{ secrets.CF_TOKEN5 }}
          APEX_CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.APEX_CLOUDFLARE_DEPLOY_TOKEN }}
          PROBE_ACCOUNT_ID2: ${{ secrets.PROBE_ACCOUNT_ID2 }}
          PROBE_TOKEN_F: ${{ secrets.PROBE_TOKEN_F }}
          PROBE_TOKEN_G: ${{ secrets.PROBE_TOKEN_G }}
        run: |
          set +e
          REPORT="$RUNNER_TEMP/credential-audit.md"
          : > "$REPORT"
          printf '%s\n' '# Credential Audit — redacted, non-gating' '' '| Credential / Gate | Present | Live status | Evidence |' '|---|---:|---|---|' >> "$REPORT"

          row() {
            local name="$1" present="$2" status="$3" evidence="$4"
            evidence=$(printf '%s' "$evidence" | tr '\n\r|' '   ' | cut -c1-220)
            printf '| `%s` | %s | **%s** | %s |\n' "$name" "$present" "$status" "$evidence" >> "$REPORT"
          }

          mask_if_set() {
            [ -n "$2" ] && echo "::add-mask::$2"
          }

          for n in CLOUDFLARE_API_TOKEN CF_AIG_AUTHORIZATION CF_AIG_TOKEN GATEWAY_AUTH_TOKEN PROVIDER_GATEWAY_AUTH_TOKEN MCP_AUTH_TOKEN HUGGINGFACE_TOKEN GH_RUNNER_PAT GITHUB_RUNNER_PAT VERCEL_TOKEN VERCEL_TEAM_TOKEN CF_TOKEN5 APEX_CLOUDFLARE_DEPLOY_TOKEN PROBE_TOKEN_F PROBE_TOKEN_G; do
            mask_if_set "$n" "${!n}"
          done

          cf_verify() {
            local name="$1" tok="$2" acct="$3"
            if [ -z "$tok" ]; then
              row "$name" no MISSING 'secret not configured'
              return
            fi
            code=$(curl -sS --max-time 20 -o /tmp/cfv.json -w '%{http_code}' -H "Authorization: Bearer $tok" https://api.cloudflare.com/client/v4/user/tokens/verify)
            state=$(jq -r '.result.status // "unknown"' /tmp/cfv.json 2>/dev/null)
            if [ "$code" != 200 ] || [ "$state" != active ]; then
              row "$name" yes FAIL "token verify HTTP=$code status=$state"
              return
            fi
            if [ -n "$acct" ]; then
              acode=$(curl -sS --max-time 20 -o /tmp/cfa.json -w '%{http_code}' -H "Authorization: Bearer $tok" "https://api.cloudflare.com/client/v4/accounts/$acct")
              if [ "$acode" = 200 ]; then
                row "$name" yes PASS 'active; configured account access HTTP=200'
              else
                row "$name" yes PARTIAL "active; configured account access HTTP=$acode"
              fi
            else
              row "$name" yes PASS 'active token; no account supplied for scope test'
            fi
          }

          test_gateway_auth() {
            local name="$1" tok="$2"
            if [ -z "$tok" ]; then
              row "$name" no MISSING 'secret not configured'
              return
            fi
            code=$(curl -sS --max-time 20 -o /tmp/gw.json -w '%{http_code}' -H "Authorization: Bearer $tok" https://cf-control-mcp.amin-chinisaz-edu.workers.dev/v1/models)
            count=$(jq '.data | length' /tmp/gw.json 2>/dev/null || echo 0)
            if [ "$code" = 200 ] && [ "$count" -gt 0 ]; then
              row "$name" yes PASS "/v1/models HTTP=200 models=$count"
            else
              msg=$(jq -r '.error.message // .message // empty' /tmp/gw.json 2>/dev/null | cut -c1-140)
              row "$name" yes FAIL "/v1/models HTTP=$code models=$count error=$msg"
            fi
          }

          test_github() {
            local name="$1" tok="$2"
            if [ -z "$tok" ]; then
              row "$name" no MISSING 'secret not configured'
              return
            fi
            ucode=$(curl -sS --max-time 20 -o /tmp/ghu.json -w '%{http_code}' -H "Authorization: Bearer $tok" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/user)
            if [ -n "$GITHUB_RUNNER_REPO" ]; then
              repo=$(printf '%s' "$GITHUB_RUNNER_REPO" | sed -E 's#^https?://github.com/##; s#^git@github.com:##; s#\.git$##; s#/$##')
              rcode=$(curl -sS --max-time 20 -o /tmp/ghr.json -w '%{http_code}' -H "Authorization: Bearer $tok" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$repo")
            else
              rcode=0
            fi
            if [ "$ucode" = 200 ] && { [ -z "$GITHUB_RUNNER_REPO" ] || [ "$rcode" = 200 ]; }; then
              row "$name" yes PASS "user HTTP=$ucode repo HTTP=$rcode"
            else
              row "$name" yes FAIL "user HTTP=$ucode repo HTTP=$rcode"
            fi
          }

          # Canonical Cloudflare management token and account.
          cf_verify CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_ACCOUNT_ID"

          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            for spec in \
              "Workers|https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
              "D1|https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              "AI_Gateway|https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-gateway/gateways" \
              "Secrets_Store|https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores"; do
              label=${spec%%|*}
              url=${spec#*|}
              code=$(curl -sS --max-time 20 -o /tmp/cfscope.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url")
              row "CLOUDFLARE_API_TOKEN:$label" yes "$([ "$code" = 200 ] && echo PASS || echo FAIL)" "HTTP=$code"
            done

            # Worker runtime secret bindings: names only, never values.
            wcode=$(curl -sS --max-time 20 -o /tmp/worker-secrets.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/cf-control-mcp/secrets")
            missing=''
            if [ "$wcode" = 200 ]; then
              for req in MCP_AUTH_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GATEWAY_AUTH_TOKEN CF_AIG_TOKEN; do
                jq -e --arg n "$req" '.result[]? | select(.name == $n)' /tmp/worker-secrets.json >/dev/null 2>&1 || missing="$missing $req"
              done
            fi
            if [ "$wcode" = 200 ] && [ -z "$missing" ]; then
              row 'Worker required secret bindings' yes PASS 'HTTP=200; all required secret names present'
            else
              row 'Worker required secret bindings' yes FAIL "HTTP=$wcode; missing=$missing"
            fi

            # AI Gateway metadata only. No Gemini inference here: provider quota is a separate concern.
            acode=$(curl -sS --max-time 20 -o /tmp/aig-meta.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-gateway/gateways/cf-control-mcp")
            auth=$(jq -r '.result.authentication // .result.auth_required // false' /tmp/aig-meta.json 2>/dev/null)
            row 'AI Gateway authentication metadata' yes "$([ "$acode" = 200 ] && { [ "$auth" = true ] || [ "$auth" = 1 ]; } && echo PASS || echo FAIL)" "HTTP=$acode authentication=$auth"

            pcode=$(curl -sS --max-time 20 -o /tmp/provider-configs.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-gateway/gateways/cf-control-mcp/provider_configs")
            default=$(jq -r '.result[]? | select(.provider_slug == "google-ai-studio" and .alias == "default") | .default_config' /tmp/provider-configs.json 2>/dev/null | head -n1)
            row 'BYOK Provider Config metadata' yes "$([ "$pcode" = 200 ] && { [ "$default" = true ] || [ "$default" = 1 ]; } && echo PASS || echo FAIL)" "HTTP=$pcode default_config=$default"

            scode=$(curl -sS --max-time 20 -o /tmp/stores.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores")
            sid=$(jq -r '.result[]? | select(.name == "default_secrets_store") | .id' /tmp/stores.json 2>/dev/null | head -n1)
            if [ "$scode" = 200 ] && [ -n "$sid" ]; then
              s2code=$(curl -sS --max-time 20 -o /tmp/store-secrets.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores/$sid/secrets")
              byok=$(jq -r '.result[]? | select(.name == "cf-control-mcp_google-ai-studio_default") | [.status, (.scopes | join(","))] | @tsv' /tmp/store-secrets.json 2>/dev/null | head -n1)
              row 'BYOK Secrets Store metadata' yes "$([ "$s2code" = 200 ] && [ -n "$byok" ] && echo PASS || echo FAIL)" "HTTP=$s2code present=$([ -n "$byok" ] && echo yes || echo no)"
            else
              row 'BYOK Secrets Store metadata' yes FAIL "stores HTTP=$scode default store present=$([ -n "$sid" ] && echo yes || echo no)"
            fi
          else
            row CLOUDFLARE_ACCOUNT_ID no BLOCKED 'canonical account variable/secret or management token missing'
          fi

          # Provider Gateway auth only; do not consume Gemini quota.
          test_gateway_auth GATEWAY_AUTH_TOKEN "$GATEWAY_AUTH_TOKEN"
          test_gateway_auth PROVIDER_GATEWAY_AUTH_TOKEN "$PROVIDER_GATEWAY_AUTH_TOKEN"

          # MCP protocol + exact tool inventory.
          if [ -n "$MCP_AUTH_TOKEN" ]; then
            icode=$(curl -sS --max-time 20 -o /tmp/mcpi.json -w '%{http_code}' -X POST https://cf-control-mcp.amin-chinisaz-edu.workers.dev/mcp -H "Authorization: Bearer $MCP_AUTH_TOKEN" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"credential-audit","version":"2"}}}')
            protocol=$(jq -r '.result.protocolVersion // empty' /tmp/mcpi.json 2>/dev/null)
            tcode=$(curl -sS --max-time 20 -o /tmp/mcpt.json -w '%{http_code}' -X POST https://cf-control-mcp.amin-chinisaz-edu.workers.dev/mcp -H "Authorization: Bearer $MCP_AUTH_TOKEN" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
            tools=$(jq '.result.tools | length' /tmp/mcpt.json 2>/dev/null || echo 0)
            if [ "$icode" = 200 ] && [ "$tcode" = 200 ] && [ "$tools" = 44 ]; then
              row MCP_AUTH_TOKEN yes PASS "initialize HTTP=$icode protocol=$protocol; tools/list HTTP=$tcode count=$tools"
            else
              row MCP_AUTH_TOKEN yes FAIL "initialize HTTP=$icode protocol=$protocol; tools/list HTTP=$tcode count=$tools"
            fi
          else
            row MCP_AUTH_TOKEN no MISSING 'secret not configured'
          fi

          # External non-Google credentials.
          if [ -n "$HUGGINGFACE_TOKEN" ]; then
            code=$(curl -sS --max-time 20 -o /tmp/hf.json -w '%{http_code}' -H "Authorization: Bearer $HUGGINGFACE_TOKEN" https://huggingface.co/api/whoami-v2)
            row HUGGINGFACE_TOKEN yes "$([ "$code" = 200 ] && echo PASS || echo FAIL)" "whoami-v2 HTTP=$code"
          else
            row HUGGINGFACE_TOKEN no MISSING 'secret not configured'
          fi

          test_github GH_RUNNER_PAT "$GH_RUNNER_PAT"
          test_github GITHUB_RUNNER_PAT "$GITHUB_RUNNER_PAT"
          row GITHUB_RUNNER_REPO "$([ -n "$GITHUB_RUNNER_REPO" ] && echo yes || echo no)" "$([ -n "$GITHUB_RUNNER_REPO" ] && echo INFO || echo MISSING)" 'canonical repository identifier is read from vars first, legacy secret fallback second'

          for spec in "VERCEL_TOKEN|$VERCEL_TOKEN" "VERCEL_TEAM_TOKEN|$VERCEL_TEAM_TOKEN"; do
            name=${spec%%|*}
            tok=${spec#*|}
            if [ -n "$tok" ]; then
              code=$(curl -sS --max-time 20 -o /tmp/vercel.json -w '%{http_code}' -H "Authorization: Bearer $tok" https://api.vercel.com/v2/user)
              row "$name" yes "$([ "$code" = 200 ] && echo PASS || echo FAIL)" "/v2/user HTTP=$code"
            else
              row "$name" no MISSING 'secret not configured'
            fi
          done

          # Legacy/probe credentials remain informational; never revoke automatically.
          cf_verify CF_TOKEN5 "$CF_TOKEN5" 'd902b91f0f1076e0601ffd6e7b4382c0'
          cf_verify APEX_CLOUDFLARE_DEPLOY_TOKEN "$APEX_CLOUDFLARE_DEPLOY_TOKEN" 'd902b91f0f1076e0601ffd6e7b4382c0'
          cf_verify PROBE_TOKEN_F "$PROBE_TOKEN_F" "$PROBE_ACCOUNT_ID2"
          cf_verify PROBE_TOKEN_G "$PROBE_TOKEN_G" "$PROBE_ACCOUNT_ID2"

          row 'Google/Gemini inference quota' yes INFO 'intentionally excluded from credential-health verdict; daily quota exhaustion is tracked separately'

          cat "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Audit is intentionally non-gating; credential/config metadata is separated from Google inference quota.'
          exit 0
