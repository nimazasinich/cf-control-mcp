name: Deploy Admin Gateway to Vercel

on:
  push:
    branches: [main]
    paths:
      - "vercel-admin/**"
      - ".github/workflows/deploy-vercel-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
      PROJECT_NAME: cf-control-mcp-admin
      WORKER_BASE_URL: https://cf-control-mcp.amin-chinisaz-edu.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "MISSING_REQUIRED_SECRET: VERCEL_TOKEN"; exit 1; }
          test -n "${MCP_AUTH_TOKEN:-}" || { echo "MISSING_REQUIRED_SECRET: MCP_AUTH_TOKEN"; exit 1; }
          echo "PASS: Vercel deployment and live Admin verification secrets are configured"

      - name: Ensure Vercel project exists
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes vercel@latest project inspect "$PROJECT_NAME" --token "$VERCEL_TOKEN" >/tmp/vercel-project.txt 2>&1; then
            echo "PASS: Vercel project already exists: $PROJECT_NAME"
          else
            echo "INFO: creating Vercel project: $PROJECT_NAME"
            npx --yes vercel@latest project add "$PROJECT_NAME" --token "$VERCEL_TOKEN"
          fi

      - name: Deploy Admin gateway to Vercel production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_URL="$(npx --yes vercel@latest deploy ./vercel-admin --prod --yes --token "$VERCEL_TOKEN" --project "$PROJECT_NAME" | tail -n 1 | tr -d '\r')"
          if [[ "$DEPLOY_URL" != https://* ]]; then
            echo "FAIL: Vercel CLI did not return a deployment URL"
            exit 1
          fi
          echo "Deployment URL: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel Admin gateway live
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          login_code="$(curl --silent --show-error --output /tmp/admin-login.html --write-out '%{http_code}' "$DEPLOY_URL/admin")"
          if [ "$login_code" != "200" ]; then
            echo "FAIL: Vercel /admin login page HTTP=$login_code"
            exit 1
          fi
          grep -q 'cf-control-mcp — Admin' /tmp/admin-login.html || {
            echo "FAIL: Vercel /admin did not render the Worker Admin login page"
            exit 1
          }
          echo "PASS: Vercel /admin serves the live Worker Admin login page"

          unauth_code="$(curl --silent --show-error --output /tmp/admin-unauth.json --write-out '%{http_code}' "$DEPLOY_URL/admin/api/tools")"
          if [ "$unauth_code" != "401" ]; then
            echo "FAIL: unauthenticated /admin/api/tools expected 401, got HTTP=$unauth_code"
            exit 1
          fi
          echo "PASS: Vercel Admin API remains owner-session protected"

          login_post_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --cookie-jar /tmp/admin-cookies.txt --request POST "$DEPLOY_URL/admin/login" --data-urlencode "token=$MCP_AUTH_TOKEN")"
          if [ "$login_post_code" != "302" ]; then
            echo "FAIL: Admin login through Vercel expected 302, got HTTP=$login_post_code"
            exit 1
          fi

          auth_code="$(curl --silent --show-error --output /tmp/admin-tools.json --write-out '%{http_code}' --cookie /tmp/admin-cookies.txt "$DEPLOY_URL/admin/api/tools")"
          if [ "$auth_code" != "200" ]; then
            echo "FAIL: authenticated /admin/api/tools through Vercel HTTP=$auth_code"
            exit 1
          fi

          admin_count="$(jq -r '.count // 0' /tmp/admin-tools.json)"
          admin_len="$(jq -r '.tools | length' /tmp/admin-tools.json)"
          if [ "$admin_count" != "44" ] || [ "$admin_len" != "44" ]; then
            echo "FAIL: Vercel Admin MCP Tools catalog count=$admin_count length=$admin_len; expected 44"
            exit 1
          fi

          curl --silent --show-error --output /tmp/runtime-tools.json \
            --request POST "$WORKER_BASE_URL/mcp" \
            --header "Authorization: Bearer $MCP_AUTH_TOKEN" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'

          jq -S '.tools | map(.name) | sort' /tmp/admin-tools.json > /tmp/admin-names.json
          jq -S '.result.tools | map(.name) | sort' /tmp/runtime-tools.json > /tmp/runtime-names.json
          if ! cmp -s /tmp/admin-names.json /tmp/runtime-names.json; then
            echo "FAIL: Vercel Admin catalog does not match runtime MCP tools/list"
            exit 1
          fi

          echo "FINAL: PASS — Vercel Admin gateway login/session and 44-tool runtime catalog verified end-to-end"
