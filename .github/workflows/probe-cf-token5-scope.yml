name: Probe CF_TOKEN5 capabilities

on:
  push:
    branches: [release/v1.8.0-final-verified-20260916]
    paths:
      - '.github/workflows/probe-cf-token5-scope.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe non-secret Cloudflare capability surfaces
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN5 }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$ACCOUNT_ID"
          auth=(-H "Authorization: Bearer ${CF_TOKEN}")
          probe() {
            local label="$1" url="$2"
            local code
            code="$(curl -sS --max-time 30 -o /tmp/probe.json -w '%{http_code}' "${auth[@]}" "$url")"
            echo "$label HTTP=$code"
          }
          probe account "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}"
          probe ai_gateway "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai-gateway/gateways/cf-control-mcp"
          probe provider_configs "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai-gateway/gateways/cf-control-mcp/provider_configs"
          probe account_token_permission_groups "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/tokens/permission_groups?name=AI%20Gateway%20Read"
          probe account_tokens "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/tokens?per_page=1"
          probe worker_settings "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/cf-control-mcp/settings"
          d1_code="$(curl -sS --max-time 30 -o /tmp/d1.json -w '%{http_code}' "${auth[@]}" -H 'Content-Type: application/json' --data '{"sql":"SELECT 1 AS ok;"}' "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database/138a2aef-9f5a-4635-8346-dc474fdfff93/query")"
          echo "d1_query HTTP=$d1_code"
          echo 'PASS: CF_TOKEN5 capability probe completed without printing credentials'
