name: Verify live Vercel Admin

on:
  push:
    branches: [verify/vercel-admin-live]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_URL: https://cf-control-mcp-admin-dreammakers-projects-6bd02e6d.vercel.app
    steps:
      - name: Inspect Vercel Admin redirect
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --dump-header /tmp/headers.txt --output /tmp/body.html --write-out '%{http_code}' "$ADMIN_URL/admin")"
          echo "HTTP=$code"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' /tmp/headers.txt)"
          echo "Location=${location:-none}"
          echo "Server=$(awk 'BEGIN{IGNORECASE=1} /^server:/ {sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' /tmp/headers.txt)"
          if [ "$code" = "200" ]; then
            grep -q 'cf-control-mcp — Admin' /tmp/body.html || { echo 'FAIL: unexpected 200 body'; exit 1; }
            echo 'PASS: Admin login page is directly reachable'
            exit 0
          fi
          if [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
            echo 'INFO: redirect captured for diagnosis'
            exit 0
          fi
          echo "FAIL: unexpected HTTP=$code"
          exit 1
