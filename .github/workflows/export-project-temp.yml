name: Temporary exact-source project export

on:
  push:
    branches:
      - feat/dreamworker-production-admin-ui
    paths:
      - ".github/workflows/export-project-temp.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: 469978338d6a438ee94cc5451597ff780098dfd3
          fetch-depth: 1

      - name: Prove exact SHA and build source package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "469978338d6a438ee94cc5451597ff780098dfd3"
          ROOT="cf-control-mcp-469978338d6a438ee94cc5451597ff780098dfd3"
          mkdir -p "$RUNNER_TEMP/$ROOT"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/$ROOT"
          cat > "$RUNNER_TEMP/$ROOT/PROJECT_CHECKPOINT.txt" <<'EOF'
          Repository: nimazasinich/cf-control-mcp
          Branch snapshot: main
          Source SHA: 469978338d6a438ee94cc5451597ff780098dfd3
          Parent production merge SHA: 28213b938ff2ad0c59a3cbbf363789d406d003f4
          PR #31: merged
          Production Worker: https://cf-control-mcp.amin-chinisaz-edu.workers.dev
          Admin UI: https://cf-control-mcp.amin-chinisaz-edu.workers.dev/admin
          MCP endpoint: https://cf-control-mcp.amin-chinisaz-edu.workers.dev/mcp
          Deployed Worker Version ID: 4abe2e94-4683-4ce4-b6d7-1351d74b95b1
          Pre-merge CI: PASS on exact source 31f7529f047bef6e351a38b56907ac03f0589668
          Pre-merge 1368x753 Admin Visual Acceptance: PASS on exact source 31f7529f047bef6e351a38b56907ac03f0589668
          Post-merge Cloudflare deploy: PASS
          Post-merge production acceptance: PASS
          MCP tools/list expected and verified: 44 tools
          Note: no local .env, credentials, tokens, node_modules, or .git history are included.
          EOF
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/cf-control-mcp-project-4699783.zip" "$ROOT"
          sha256sum "$GITHUB_WORKSPACE/cf-control-mcp-project-4699783.zip" > "$GITHUB_WORKSPACE/cf-control-mcp-project-4699783.zip.sha256"

      - name: Upload project package
        uses: actions/upload-artifact@v4
        with:
          name: cf-control-mcp-project-4699783
          path: |
            cf-control-mcp-project-4699783.zip
            cf-control-mcp-project-4699783.zip.sha256
          if-no-files-found: error
          retention-days: 7
