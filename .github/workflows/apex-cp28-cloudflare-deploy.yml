name: APEX CP28 Exact-Artifact Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - 'requests/apex-deploy/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apex-cp28-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select pending request
        id: request
        run: python3 scripts/apex_deploy_helper.py select >> "$GITHUB_OUTPUT"

      - name: Decrypt one-time artifact URL and download exact ZIP
        id: artifact
        continue-on-error: true
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
        run: |
          set +e
          req='${{ steps.request.outputs.file }}'
          tmp_url=$(mktemp)
          python3 scripts/apex_deploy_helper.py decrypt-url "$req" "$tmp_url"
          code=$?
          if [ "$code" -ne 0 ]; then
            rm -f "$tmp_url"
            echo "exit_code=$code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_url=$(cat "$tmp_url")
          rm -f "$tmp_url"
          curl --fail --silent --show-error --location --output /tmp/apex-cp28.zip "$artifact_url"
          code=$?
          unset artifact_url
          if [ "$code" -ne 0 ]; then
            echo "exit_code=$code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual_sha=$(sha256sum /tmp/apex-cp28.zip | awk '{print $1}')
          if [ "$actual_sha" != '${{ steps.request.outputs.artifact_sha256 }}' ]; then
            rm -f /tmp/apex-cp28.zip
            echo "exit_code=42" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify and build exact APEX source
        id: build
        if: steps.artifact.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set +e
          python3 scripts/apex_deploy_helper.py extract /tmp/apex-cp28.zip /tmp/apex-cp28-src >> "$GITHUB_OUTPUT"
          code=$?
          if [ "$code" -ne 0 ]; then echo "exit_code=51" >> "$GITHUB_OUTPUT"; exit 0; fi
          cd /tmp/apex-cp28-src
          test "$(tr -d '\r\n' < VERSION)" = "2.0.1" || { echo "exit_code=52" >> "$GITHUB_OUTPUT"; exit 0; }
          npm ci || { echo "exit_code=53" >> "$GITHUB_OUTPUT"; exit 0; }
          npm run lint || { echo "exit_code=54" >> "$GITHUB_OUTPUT"; exit 0; }
          npm run release:gate:source || { echo "exit_code=55" >> "$GITHUB_OUTPUT"; exit 0; }
          npm run check:root-contract || { echo "exit_code=56" >> "$GITHUB_OUTPUT"; exit 0; }
          npm run check:version-identity || { echo "exit_code=57" >> "$GITHUB_OUTPUT"; exit 0; }
          npm run check:api-contract || { echo "exit_code=58" >> "$GITHUB_OUTPUT"; exit 0; }
          npm run qa:app-index || { echo "exit_code=59" >> "$GITHUB_OUTPUT"; exit 0; }
          npm run qa:smart-autopilot || { echo "exit_code=60" >> "$GITHUB_OUTPUT"; exit 0; }
          npm run qa:unified-safety-runtime || { echo "exit_code=61" >> "$GITHUB_OUTPUT"; exit 0; }
          npm run build || { echo "exit_code=62" >> "$GITHUB_OUTPUT"; exit 0; }
          test -f dist/server.cjs || { echo "exit_code=63" >> "$GITHUB_OUTPUT"; exit 0; }
          test -f dist/index.html || { echo "exit_code=64" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare full-project Cloudflare Container harness
        id: harness
        if: steps.build.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set +e
          python3 scripts/apex_deploy_helper.py prepare-harness /tmp/apex-cp28-src '${{ steps.request.outputs.worker_name }}'
          code=$?
          if [ "$code" -ne 0 ]; then echo "exit_code=71" >> "$GITHUB_OUTPUT"; exit 0; fi
          cd /tmp/apex-cp28-src
          npm install --no-save --package-lock=false @cloudflare/containers wrangler@latest || { echo "exit_code=72" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resolve Cloudflare account ID
        id: account
        if: steps.harness.outputs.exit_code == '0'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          response=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts?per_page=1")
          code=$?
          if [ "$code" -ne 0 ]; then echo "exit_code=81" >> "$GITHUB_OUTPUT"; exit 0; fi
          account_id=$(printf '%s' "$response" | python3 -c "import json,sys;d=json.load(sys.stdin);assert d.get('success') is True and d.get('result');print(d['result'][0]['id'])")
          code=$?
          if [ "$code" -ne 0 ]; then echo "exit_code=82" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "id=$account_id" >> "$GITHUB_OUTPUT"
          echo "exit_code=0" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Deploy complete APEX project to Cloudflare Containers
        id: cloudflare
        if: steps.account.outputs.exit_code == '0'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.id }}
        run: |
          set +e
          cd /tmp/apex-cp28-src
          npx wrangler deploy --config wrangler.apex.jsonc > /tmp/apex-cloudflare-deploy.log 2>&1
          code=$?
          cat /tmp/apex-cloudflare-deploy.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            url=$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/apex-cloudflare-deploy.log | tail -1 || true)
            if [ -z "$url" ]; then
              subdomain=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | python3 -c "import json,sys;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain',''))" 2>/dev/null || true)
              if [ -n "$subdomain" ]; then url="https://${{ steps.request.outputs.worker_name }}.${subdomain}.workers.dev"; fi
            fi
            if [ -n "$url" ]; then echo "url=$url" >> "$GITHUB_OUTPUT"; fi
          fi
          exit 0

      - name: Verify live staging URL
        id: live
        if: steps.cloudflare.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          set +e
          url='${{ steps.cloudflare.outputs.url }}'
          if [ -z "$url" ]; then echo "exit_code=91" >> "$GITHUB_OUTPUT"; exit 0; fi
          ok=0
          code=000
          for i in $(seq 1 36); do
            code=$(curl -sS -o /tmp/apex-live-body -w '%{http_code}' "$url/" || true)
            if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 500 ] 2>/dev/null; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" -eq 1 ]; then
            echo "http_status=$code" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=92" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Write sanitized deployment result
        if: always() && steps.request.outputs.file != ''
        env:
          ARTIFACT_EXIT: ${{ steps.artifact.outputs.exit_code }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          HARNESS_EXIT: ${{ steps.harness.outputs.exit_code }}
          ACCOUNT_EXIT: ${{ steps.account.outputs.exit_code }}
          CLOUDFLARE_EXIT: ${{ steps.cloudflare.outputs.exit_code }}
          LIVE_EXIT: ${{ steps.live.outputs.exit_code }}
          LIVE_URL: ${{ steps.cloudflare.outputs.url }}
          LIVE_HTTP: ${{ steps.live.outputs.http_status }}
          FILE_COUNT: ${{ steps.build.outputs.file_count }}
        run: python3 scripts/apex_deploy_helper.py write-result '${{ steps.request.outputs.file }}'

      - name: Commit sanitized deployment result
        if: always() && steps.request.outputs.file != ''
        run: |
          set -euo pipefail
          git config user.email "actions@github.com"
          git config user.name "apex-cloudflare-deploy"
          git add results/apex-deploy/ || true
          if git diff --cached --quiet; then echo "No deployment result to commit."; exit 0; fi
          git commit -m "chore(apex): record CP28 Cloudflare deployment result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce deployment result
        if: always()
        run: |
          test '${{ steps.artifact.outputs.exit_code }}' = '0'
          test '${{ steps.build.outputs.exit_code }}' = '0'
          test '${{ steps.harness.outputs.exit_code }}' = '0'
          test '${{ steps.account.outputs.exit_code }}' = '0'
          test '${{ steps.cloudflare.outputs.exit_code }}' = '0'
          test '${{ steps.live.outputs.exit_code }}' = '0'
