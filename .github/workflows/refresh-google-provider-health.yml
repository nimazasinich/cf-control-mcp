name: Refresh Google provider health evidence

on:
  push:
    branches: [release/v1.8.0-final-verified-20260916]
    paths:
      - '.github/workflows/refresh-google-provider-health.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Run owner-authenticated Google health test and verify persisted state
        shell: bash
        env:
          BASE_URL: https://cf-control-mcp.amin-chinisaz-edu.workers.dev
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          GATEWAY_AUTH_TOKEN: ${{ secrets.GATEWAY_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$MCP_AUTH_TOKEN"
          test -n "$GATEWAY_AUTH_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          login_code="$(curl -sS --max-time 30 -o /tmp/login.out -D /tmp/login.headers -c /tmp/cookies.txt -w '%{http_code}' \
            -X POST "${BASE_URL}/admin/login" \
            -H "Origin: ${BASE_URL}" \
            -H "Referer: ${BASE_URL}/admin" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "token=${MCP_AUTH_TOKEN}")"
          echo "admin_login HTTP=$login_code"
          test "$login_code" = "302"

          health_code="$(curl -sS --max-time 60 -o /tmp/health.json -w '%{http_code}' \
            -X POST "${BASE_URL}/admin/api/providers/google-ai-studio/health-test" \
            -b /tmp/cookies.txt \
            -H "Origin: ${BASE_URL}" \
            -H "Referer: ${BASE_URL}/admin" \
            -H 'Content-Type: application/json' \
            --data '{}')"
          echo "health_test HTTP=$health_code"
          jq -c '{ok,state,latencyMs,httpStatus,gatewayVerified,gatewayEvidence:(.gatewayLogId != null),gatewayStep,errorMessage,modelId}' /tmp/health.json
          test "$health_code" = "200"

          model_code="$(curl -sS --max-time 30 -o /tmp/models.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GATEWAY_AUTH_TOKEN}" \
            "${BASE_URL}/v1/models")"
          model_count="$(jq '.data | length' /tmp/models.json 2>/dev/null || echo 0)"
          echo "v1_models HTTP=$model_code count=$model_count"

          d1_code="$(curl -sS --max-time 30 -o /tmp/d1.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT id, enabled, health_state, last_http_status, last_gateway_log_id, last_gateway_step, last_success_at, last_error_at, last_error_message FROM providers WHERE id = ?1;","params":["google-ai-studio"]}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/138a2aef-9f5a-4635-8346-dc474fdfff93/query")"
          echo "d1_provider_state HTTP=$d1_code"
          if [ "$d1_code" = 200 ]; then
            jq -c '.result[0].results[0] | {id,enabled,health_state,last_http_status,gatewayEvidence:(.last_gateway_log_id != null),last_gateway_step,last_success_at,last_error_at,last_error_message}' /tmp/d1.json
          fi

          if [ "$(jq -r '.state // empty' /tmp/health.json)" != "HEALTHY" ]; then
            echo 'FAIL: live Google provider health is not HEALTHY'
            exit 1
          fi
          test "$model_code" = "200"
          test "$model_count" -gt 0
          echo 'PASS: Google provider health evidence persisted and /v1/models is non-empty'
