name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npx tsc --noEmit

      - name: Run Internet Intelligence tests (SSRF, providers, robots, HTML, crawl, tools)
        run: npm test

      - name: Validate Python verification and bridge scripts
        run: python3 -m py_compile scripts/oauth_smoke.py scripts/apex_cf_bridge.py
