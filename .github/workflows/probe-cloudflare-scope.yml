name: Probe Cloudflare token capabilities

on:
  push:
    branches: [release/v1.8.0-final-verified-20260916]
    paths:
      - '.github/workflows/probe-cloudflare-scope.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe non-secret Cloudflare capability/status surfaces
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          test -n "$ACCOUNT_ID"
          auth=(-H "Authorization: Bearer ${CF_TOKEN}")

          probe() {
            local label="$1" url="$2" out="$3"
            local code
            code="$(curl -sS --max-time 30 -o "$out" -w '%{http_code}' "${auth[@]}" "$url")"
            echo "$label HTTP=$code"
          }

          probe account "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}" /tmp/account.json
          probe ai_gateway "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai-gateway/gateways/cf-control-mcp" /tmp/aig.json
          probe provider_configs "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai-gateway/gateways/cf-control-mcp/provider_configs" /tmp/pc.json
          probe account_token_permission_groups "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/tokens/permission_groups?name=AI%20Gateway%20Read" /tmp/pg.json
          probe account_tokens "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/tokens?per_page=1" /tmp/tokens.json

          d1_code="$(curl -sS --max-time 30 -o /tmp/d1.json -w '%{http_code}' "${auth[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT id, enabled, health_state, last_http_status, last_gateway_log_id, last_gateway_step, last_success_at, last_error_at FROM providers ORDER BY priority, id;"}' \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/d1/database/138a2aef-9f5a-4635-8346-dc474fdfff93/query")"
          echo "d1_provider_state HTTP=$d1_code"
          if [ "$d1_code" = 200 ]; then
            jq -c '[.result[0].results[] | {id,enabled,health_state,last_http_status,gateway_evidence:(.last_gateway_log_id != null),gateway_step,last_success_at,last_error_at}]' /tmp/d1.json
          fi

          # Never print response bodies from failed auth/capability probes: they may contain request metadata.
          echo "PASS: capability probe completed without printing credentials"
