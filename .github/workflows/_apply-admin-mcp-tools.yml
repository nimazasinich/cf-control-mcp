name: Apply admin MCP Tools

on:
  push:
    branches:
      - feat/admin-mcp-tools
    paths:
      - .github/workflows/_apply-admin-mcp-tools.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-mcp-tools
          fetch-depth: 0
      - name: Apply Admin MCP Tools patch
        run: python3 scripts/_apply_admin_mcp_tools.py
      - name: Verify
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
      - name: Commit verified changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add src/oauth-worker.ts src/admin/router.ts src/admin/ui.ts test/admin-mcp-tools.test.ts
          git commit -m "feat: add live MCP Tools catalog to admin"
          git push origin HEAD:feat/admin-mcp-tools
