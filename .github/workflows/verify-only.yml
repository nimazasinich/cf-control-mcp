name: Verify only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required verification secrets
        shell: bash
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_AUTH_TOKEN: ${{ secrets.GATEWAY_AUTH_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in MCP_AUTH_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GATEWAY_AUTH_TOKEN CF_AIG_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_REQUIRED_SECRET: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: all required verification secrets are configured"

      - name: Run live OAuth/MCP and production acceptance
        shell: bash
        env:
          MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_AUTH_TOKEN: ${{ secrets.GATEWAY_AUTH_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          HF_LIVE_CHECK: ${{ secrets.HUGGINGFACE_TOKEN != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          exec > >(tee verify.log) 2>&1
          echo "=== OAuth + MCP protocol acceptance ==="
          MCP_BASE_URL="https://cf-control-mcp.amin-chinisaz-edu.workers.dev" python3 scripts/oauth_smoke.py
          echo "=== Provider Gateway + D1 + AI Gateway + BYOK acceptance ==="
          python3 scripts/verify_production.py

      - name: Commit verification log
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "verify-bot"
          git add -f verify.log
          git commit -m "chore: verify log [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"
